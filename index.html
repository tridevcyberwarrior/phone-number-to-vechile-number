<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Lookup - mParivahan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .form-section {
            padding: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        input[type="tel"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 18px;
            transition: border-color 0.3s;
            text-align: center;
            letter-spacing: 2px;
        }
        
        input[type="tel"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .results {
            display: none;
            padding: 0 30px 30px;
        }
        
        .vehicle-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        
        .vehicle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .vehicle-number {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            font-family: 'Courier New', monospace;
        }
        
        .badge {
            background: #28a745;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge.expired {
            background: #dc3545;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .detail-row:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            color: #666;
            font-size: 14px;
        }
        
        .detail-value {
            font-weight: 600;
            color: #333;
            font-size: 14px;
            text-align: right;
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin: 0 30px 30px;
            display: none;
            border-left: 4px solid #dc3545;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .status-valid {
            color: #28a745;
        }
        
        .status-expired {
            color: #dc3545;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            color: #666;
            font-size: 12px;
        }
        
        @media (max-width: 480px) {
            .header h1 {
                font-size: 24px;
            }
            .vehicle-number {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚗 Vehicle Lookup</h1>
            <p>mParivahan / NAPIX Integration</p>
        </div>
        
        <div class="form-section">
            <div class="input-group">
                <label for="mobile">Mobile Number</label>
                <input 
                    type="tel" 
                    id="mobile" 
                    placeholder="Enter 10-digit number"
                    maxlength="10"
                    pattern="[0-9]{10}"
                >
            </div>
            <button onclick="searchVehicle()" id="searchBtn">
                Search Vehicles
            </button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Searching vehicle records...</p>
        </div>
        
        <div class="error-message" id="error"></div>
        
        <div class="results" id="results"></div>
        
        <div class="footer">
            <p>Data provided by NAPIX / mParivahan</p>
            <p style="margin-top: 5px; opacity: 0.7;">Secure & Encrypted Connection</p>
        </div>
    </div>

    <script>
        document.getElementById('mobile').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        document.getElementById('mobile').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchVehicle();
        });

        async function searchVehicle() {
            const mobile = document.getElementById('mobile').value.trim();
            const btn = document.getElementById('searchBtn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const error = document.getElementById('error');

            if (!/^\d{10}$/.test(mobile)) {
                alert('Please enter valid 10-digit mobile number');
                return;
            }

            btn.disabled = true;
            loading.style.display = 'block';
            results.style.display = 'none';
            error.style.display = 'none';

            try {
                const response = await fetch('/api/lookup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ mobileNo: mobile })
                });

                const data = await response.json();

                if (data.success) {
                    displayResults(data);
                } else {
                    throw new Error(data.message || 'Failed to fetch data');
                }
            } catch (err) {
                error.textContent = err.message || 'Network error. Please try again.';
                error.style.display = 'block';
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function displayResults(data) {
            const results = document.getElementById('results');
            
            if (!data.found || data.vehicles.length === 0) {
                results.innerHTML = `
                    <div class="no-results">
                        <h3>No vehicles found</h3>
                        <p>${data.message || 'No vehicle registered against this mobile number'}</p>
                    </div>
                `;
                results.style.display = 'block';
                return;
            }

            let html = `<h3 style="margin-bottom: 20px; color: #333;">Found ${data.count} Vehicle(s)</h3>`;
            
            data.vehicles.forEach((v, i) => {
                const isExpired = (date) => {
                    if (!date || date === 'NA') return false;
                    return new Date(date) < new Date();
                };
                
                html += `
                    <div class="vehicle-card">
                        <div class="vehicle-header">
                            <div class="vehicle-number">${v['Registration No'] || 'N/A'}</div>
                            <span class="badge">Active</span>
                        </div>
                        
                        <div class="detail-row">
                            <span class="detail-label">State</span>
                            <span class="detail-value">${v['State'] || 'N/A'} (${v['State Code'] || ''})</span>
                        </div>
                        
                        <div class="detail-row">
                            <span class="detail-label">RTO Office</span>
                            <span class="detail-value">${v['RTO Office'] || 'N/A'}</span>
                        </div>
                        
                        <div class="detail-row">
                            <span class="detail-label">Registration Upto</span>
                            <span class="detail-value ${isExpired(v['Registration Upto']) ? 'status-expired' : 'status-valid'}">
                                ${v['Registration Upto'] || 'N/A'}
                            </span>
                        </div>
                        
                        <div class="detail-row">
                            <span class="detail-label">Fitness Upto</span>
                            <span class="detail-value ${isExpired(v['Fitness Upto']) ? 'status-expired' : 'status-valid'}">
                                ${v['Fitness Upto'] || 'N/A'}
                            </span>
                        </div>
                        
                        <div class="detail-row">
                            <span class="detail-label">Insurance Upto</span>
                            <span class="detail-value ${isExpired(v['Insurance Upto']) ? 'status-expired' : 'status-valid'}">
                                ${v['Insurance Upto'] || 'N/A'}
                            </span>
                        </div>
                        
                        <div class="detail-row">
                            <span class="detail-label">Tax Upto</span>
                            <span class="detail-value ${isExpired(v['Tax Upto']) ? 'status-expired' : 'status-valid'}">
                                ${v['Tax Upto'] || 'N/A'}
                            </span>
                        </div>
                        
                        <div class="detail-row">
                            <span class="detail-label">PUCC Upto</span>
                            <span class="detail-value ${isExpired(v['PUCC Upto']) ? 'status-expired' : 'status-valid'}">
                                ${v['PUCC Upto'] || 'N/A'}
                            </span>
                        </div>
                        
                        <div class="detail-row">
                            <span class="detail-label">Permit Upto</span>
                            <span class="detail-value ${isExpired(v['Permit Upto']) ? 'status-expired' : 'status-valid'}">
                                ${v['Permit Upto'] || 'N/A'}
                            </span>
                        </div>
                    </div>
                `;
            });
            
            results.innerHTML = html;
            results.style.display = 'block';
        }
    </script>
</body>
</html>
